<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go60 Cheat Sheet</title>
<style>
  /* Self-contained on purpose: the sheet SVG carries its own styles, so this
     page needs only a shell. Sized for a vertical monitor — one column, no
     chrome, scroll top to bottom. */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0a0d12; color: #e7edf5;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, system-ui, sans-serif; }
  header { display: flex; gap: 14px; align-items: baseline; padding: 9px 14px;
    background: #10151d; border-bottom: 1px solid #222c3a; }
  header h1 { font-size: 13px; margin: 0; font-weight: 650; }
  header a { color: #5e6b7c; text-decoration: none; font-size: 11.5px; }
  header a:hover { color: #4fc3f7; }
  header .err { color: #ffb59a; font-size: 12px; }
  .wrap { max-width: 1300px; margin: 0 auto; }
  .wrap svg { width: 100%; height: auto; display: block; }
  @media print { header { display: none; } }
</style>
</head>
<body>

<header>
  <h1>Go60 cheat sheet</h1>
  <a href="index.html">viewer →</a>
  <a href="wm.html">WM sheet →</a>
  <a href="practice.html">practice →</a>
  <span id="msg" class="err"></span>
</header>

<div class="wrap" id="sheet"></div>

<script src="js/geometry.js"></script>
<script src="js/keycodes.js"></script>
<script src="js/parse.js"></script>
<script src="js/render.js"></script>
<script src="js/wmjoin.js"></script>
<script src="js/sheet.js"></script>
<script src="data/layout.js"></script>
<script src="data/wm-actions.js"></script>
<script>
(function () {
  'use strict';
  var src = localStorage.getItem('g80.src') || window.G80_LAYOUT_SOURCE;
  var msg = document.getElementById('msg');
  if (!src) {
    msg.textContent = 'No layout — run `node tools/bake.js`, or load one in the viewer first.';
    return;
  }
  var m = window.G80Parse.parseAuto(src, { title: 'layout' });
  if (m.error || m.ok === false) {
    msg.textContent = m.error || (m.errors || []).join(' · ') || 'parse failed';
    return;
  }
  var built = window.G80Sheet.build(m, {
    title: m.title,
    source: window.G80_LAYOUT_NAME || '',
    wmActions: window.G80_WM_ACTIONS || []
  });
  document.getElementById('sheet').innerHTML = built.svg;
  document.title = 'Go60 Cheat Sheet — ' + (m.title || '');
})();
</script>
</body>
</html>
