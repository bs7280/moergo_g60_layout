# Build go60.uf2 from firmware/config/go60.keymap and publish it to the
# rolling `firmware-latest` release, so the download URL never changes:
#
#   https://github.com/bs7280/moergo_g60_layout/releases/download/firmware-latest/go60.uf2
#
# Adapted from moergo-keyboards/go60-zmk-config's workflow; the only changes
# are the firmware/ prefix, the keymap guard, and the release publish.
name: Firmware

on:
  push:
    paths:
      - 'layouts/go60.keymap'
      - 'firmware/**'
      - 'tools/firmware-sync.js'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The canonical keymap lives at layouts/go60.keymap; the copy the nix
      # build reads is generated here, every build, so it cannot drift. The
      # sync also validates the keymap (Go60, 60 bindings/layer, behaviours
      # resolve) and fails the build rather than compile something wrong.
      - name: Sync + validate keymap
        run: node tools/firmware-sync.js

      - uses: actions/checkout@v4
        with:
          repository: moergo-sc/zmk
          ref: main
          path: firmware/src

      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-22.05

      - uses: cachix/cachix-action@v14
        with:
          name: moergo-glove80-zmk-dev
          skipPush: true

      - name: Build combined firmware
        run: |
          nix-build firmware/config -o combined
          cp combined/go60.uf2 go60.uf2

      - uses: actions/upload-artifact@v4
        with:
          name: go60.uf2
          path: go60.uf2

      - name: Publish to the rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view firmware-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create firmware-latest --repo "$GITHUB_REPOSITORY" \
              --title "Latest Go60 firmware" --notes "placeholder"
          gh release upload firmware-latest go60.uf2 --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit firmware-latest --repo "$GITHUB_REPOSITORY" \
            --notes "Built from \`${GITHUB_SHA:0:7}\` on $(date -u +%Y-%m-%d). Flash BOTH halves with this same file — Magic + bootloader key, then drag it onto the drive (or run tools/flash.sh)."
