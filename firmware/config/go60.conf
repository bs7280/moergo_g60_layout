# Radio tuning on top of MoErgo's board defaults (which already set
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y on both halves).
#
# Oct 2026: both Windows hosts (work laptop, personal desktop) stall and drop
# over Bluetooth while the Mac on the same radio is fine. These are ZMK's
# documented Windows-side fixes -- Intel/Realtek adapters misbehave on the
# 2 Mbps PHY, and the "experimental" connection parameters are the ones ZMK
# intends to make default.
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Oct 27 2026, after the above: a clean re-pair (removed in Windows, BT_CLR
# on profile 1) still ended in Windows' "Driver error" -- paired, HID never
# bound. Passkey entry forces an authenticated bond, which ZMK names as the
# fix for managed Windows hosts; the SEC option lets a host re-pair over a
# bond that no longer matches instead of looping until a power cycle.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
